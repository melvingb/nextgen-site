name: Next.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/admin-auth]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-value-that-is-long-enough
          AUTH_GITHUB_ID: ci
          AUTH_GITHUB_SECRET: ci
          ADMIN_GITHUB_LOGIN: melvingb
